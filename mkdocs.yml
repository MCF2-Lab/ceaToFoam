site_name: ceaToFoam
site_description: NASA CEA chamber thermochemistry to OpenFOAM rocket-nozzle cases
site_url: https://mcf2-lab.github.io/ceaToFoam/
site_author: Luke Cerda and Ehsan Madadi-Kandjani
repo_url: https://github.com/MCF2-Lab/ceaToFoam
repo_name: MCF2-Lab/ceaToFoam
edit_uri: edit/main/docs/
exclude_docs: |
  requirements.txt
copyright: Copyright &copy; 2026 Luke Cerda and Ehsan Madadi-Kandjani, California State University Long Beach. GPL-3.0.

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Input reference: input.md
  - The OpenFOAM case: case.md
  - Method: method.md
  - Verification and validation: validation.md
  - Citing: citing.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
