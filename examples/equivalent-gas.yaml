# RP-1/LOX, 500 psi, O/F 2.4, 2250 lbf at sea level: nozzle sized with CEA's
# shifting-equilibrium performance, simulated with the equivalent gas of the
# same expansion, inviscid.
propellants:
  fuel: RP-1
  oxidizer: O2(L)
chamber:
  pressure: 500 psi
  mixture_ratio: 2.4
design:
  thrust: 2250 lbf
  altitude: 0 ft
  sizing: equilibrium
  gas: equilibrium
geometry:
  characteristic_length: 40 in
  convergent_half_angle: 30 deg
  divergent_half_angle: 15 deg
mesh:
  radial_cells: 40
solver:
  model: inviscid
  iterations: 20000
  write_interval: 5000
